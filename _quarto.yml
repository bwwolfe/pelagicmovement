project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - CNAME
    - images/

lang: en-AU

website:
  title: "Pelagic Movement Lab"
  description: "Dr Barrett Wolfe's research on fish movement, physiology and fisheries in a changing ocean, at the Institute for Marine and Antarctic Studies, University of Tasmania."
  site-url: "https://pelagicmovement.com"
  favicon: images/favicon.svg
  open-graph: true
  search: false
  navbar:
    logo: images/logo.svg
    logo-alt: "Pelagic Movement Lab logo"
    title: '[Pelagic Movement Lab]{.navbar-name} [Barrett Wolfe PhD]{.navbar-subtitle} [[[movement]{.w}[, ]{.visually-hidden} [physiological]{.w}[ and ]{.visually-hidden} [fisheries]{.w}]{.stack-words} [&#125;]{.stack-brace aria-hidden="true"} [ecologist]{.stack-noun}]{.navbar-stack}'
    background: light
    right:
      - text: Research
        href: research.qmd
      - text: About
        href: people.qmd
      - text: Publications
        href: publications.qmd
      - text: Study with me
        href: people.qmd#join
  page-footer:
    background: "#17293A"
    foreground: "#CBD5DD"
    left: |
      ![](images/logo-dark.svg){.footer-logo fig-alt="Pelagic Movement logo"} [[Pelagic Movement Lab]{.footer-title} [Barrett Wolfe PhD]{.footer-subtitle}]{.footer-name}

      Institute for Marine and Antarctic Studies, University of Tasmania\
      20 Castray Esplanade, Battery Point TAS 7004

      I acknowledge the palawa/pakana people, the Traditional Owners of lutruwita/Tasmania, and pay my respects to Elders past and present.
    right:
      - text: "barrett.wolfe@utas.edu.au"
        href: mailto:barrett.wolfe@utas.edu.au
      - text: "Google Scholar"
        href: https://scholar.google.com/citations?user=5sLIXE4AAAAJ
      - text: "ORCID"
        href: https://orcid.org/0000-0002-9406-0578
      - text: "UTAS profile"
        href: https://discover.utas.edu.au/Barrett.Wolfe
      - text: "Redmap Australia"
        href: https://www.redmap.org.au
      - text: "Image credits"
        href: credits.qmd
      - text: "Logo and icons"
        href: logo.qmd

format:
  html:
    theme:
      - default
      - styles/theme.scss
    toc: false
    include-in-header: _includes/icons.html
    include-after-body: _includes/reduced-motion.html
    anchor-sections: false
    reference-location: margin
    citation-location: margin
    smooth-scroll: true
    grid:
      body-width: 728px
      margin-width: 350px
      gutter-width: 2.75rem
